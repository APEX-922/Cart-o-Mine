<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">CopyCart Shared Cart</title>
  
  <!-- Open Graph Meta Tags (Dynamic Fallbacks) -->
  <meta property="og:title" id="ogTitle" content="CopyCart Shared Cart">
  <meta property="og:description" content="View shared items from CopyCart instantly.">
  <meta property="og:image" id="ogImage" content="https://apex-922.github.io/CopyCart/assets/logo.png">
  <meta property="og:url" content="https://apex-922.github.io/CopyCart/share.html">

  <script>
    // Parses URL parameters immediately on load to update the head metadata for text message scrapers
    try {
      const params = new URLSearchParams(window.location.search);
      const itemsParam = params.get("items");
      if (itemsParam) {
        const firstPart = itemsParam.split(",")[0];
        const decoded = JSON.parse(decodeURIComponent(escape(atob(firstPart))));
        if (decoded.siteTitle) {
          document.getElementById("pageTitle").textContent = decoded.siteTitle;
          document.getElementById("ogTitle").setAttribute("content", decoded.siteTitle);
        }
        if (decoded.siteImg) {
          document.getElementById("ogImage").setAttribute("content", decoded.siteImg);
        }
      }
    } catch (e) {}
  </script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 600px;
    }
    h1 {
      font-size: 22px;
      text-align: center;
      margin-bottom: 20px;
      color: #DFBA67;
    }
    .item-card {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .item-title {
      font-size: 15px;
      font-weight: 500;
      word-break: break-word;
    }
    .btn-open {
      background: linear-gradient(135deg, #FBE3B5 0%, #E2C374 50%, #B89648 100%);
      color: #000000;
      border: none;
      border-radius: 6px;
      padding: 10px 15px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: block;
    }
    .btn-open:hover {
      opacity: 0.9;
    }
    #loading {
      text-align: center;
      color: #888;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>CopyCart Shared Cart</h1>
    <div id="loading">Loading shared items...</div>
    <div id="sharedItemList"></div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById("sharedItemList");
      const loading = document.getElementById("loading");

      try {
        const params = new URLSearchParams(window.location.search);
        const itemsParam = params.get("items");

        if (!itemsParam) {
          loading.textContent = "No items found in this shared link.";
          return;
        }

        const rawItems = itemsParam.split(",");
        const parsedItems = rawItems.map(payload => {
          try {
            return JSON.parse(decodeURIComponent(escape(atob(payload))));
          } catch (err) {
            return null;
          }
        }).filter(item => item !== null && item.id);

        loading.style.display = "none";

        if (parsedItems.length === 0) {
          container.innerHTML = "<div style='text-align:center; color:#888;'>Invalid shared cart data.</div>";
          return;
        }

        parsedItems.forEach(item => {
          const card = document.createElement("div");
          card.className = "item-card";

          const titleEl = document.createElement("div");
          titleEl.className = "item-title";
          titleEl.textContent = item.t || `Item ID: ${item.id}`;

          const openBtn = document.createElement("a");
          openBtn.className = "btn-open";
          openBtn.textContent = "View Item on eBay";
          openBtn.href = `https://www.ebay.com/itm/${item.id}`;
          openBtn.target = "_blank";
          openBtn.rel = "noopener noreferrer";

          card.appendChild(titleEl);
          card.appendChild(openBtn);
          container.appendChild(card);
        });

      } catch (err) {
        loading.textContent = "Error loading shared items.";
      }
    });
  </script>

</body>
</html>
