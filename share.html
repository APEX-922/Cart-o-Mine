<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CopyCart - Shared eBay Cart Items</title>
  <style>
    :root {
      --bg-dark: #121214;
      --card-bg: #1e1e24;
      --ebay-blue: #0064D2;
      --ebay-hover: #0046be;
      --text-main: #f0f0f5;
      --text-sub: #a0a0b0;
      --accent-green: #2ecc71;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 580px;
      margin: 30px 16px;
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.08);
      height: fit-content;
    }

    .header {
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 16px;
      margin-bottom: 20px;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin: 0 0 6px 0;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-sub);
      margin: 0;
    }

    .select-all-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 0 4px;
      font-size: 13px;
      color: var(--text-sub);
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--ebay-blue);
      cursor: pointer;
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
      max-height: 420px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .item-card {
      display: flex;
      align-items: center;
      background-color: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      padding: 12px;
      gap: 12px;
      transition: background-color 0.2s ease;
    }

    .item-card:hover {
      background-color: rgba(255,255,255,0.06);
    }

    .item-img-preview {
      width: 52px;
      height: 52px;
      border-radius: 6px;
      object-fit: cover;
      background-color: #2a2a32;
      border: 1px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
    }

    .item-details {
      flex: 1;
      min-width: 0;
    }

    .item-title-link {
      color: var(--text-main);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .item-title-link:hover {
      color: #3b99fc;
      text-decoration: underline;
    }

    .item-id-tag {
      font-size: 11px;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .action-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-main {
      width: 100%;
      background: linear-gradient(135deg, var(--ebay-blue) 0%, var(--ebay-hover) 100%);
      color: #ffffff;
      border: none;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 100, 210, 0.4);
      transition: transform 0.1s ease, box-shadow 0.2s ease;
    }

    .btn-main:hover {
      box-shadow: 0 6px 16px rgba(0, 100, 210, 0.6);
    }

    .btn-main:active {
      transform: scale(0.99);
    }

    .btn-secondary {
      width: 100%;
      background: transparent;
      color: var(--text-sub);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 10px;
      font-size: 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-secondary:hover {
      color: var(--text-main);
      border-color: rgba(255,255,255,0.3);
    }

    iframe {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1 class="brand-title">CopyCart Share</h1>
      <p class="subtitle" id="item-count-text">Loading shared collection...</p>
    </div>

    <div class="select-all-bar" id="selection-bar" style="display:none;">
      <label class="checkbox-label">
        <input type="checkbox" id="select-all-chk" checked>
        <span>Select All</span>
      </label>
      <span id="selected-counter">0 Selected</span>
    </div>

    <div class="item-list" id="item-list"></div>

    <div class="action-container" id="action-box" style="display:none;">
      <button class="btn-main" id="cart-shortcut-btn">Add to eBay Cart Shortcut</button>
      <button class="btn-secondary" id="open-tabs-btn">Open Items in Separate Tabs</button>
    </div>
  </div>

  <iframe id="cookie-frame"></iframe>

  <script>
    const EPN_CAMPAIGN_ID = "5339209459";
    const EPN_ROTATION_ID = "711-53200-19255-0";

    function buildEpnUrl(itemId) {
      const baseUrl = `https://www.ebay.com/itm/${itemId}`;
      const params = new URLSearchParams({
        mkevt: "1",
        mkcid: "1",
        mkrid: EPN_ROTATION_ID,
        siteid: "0",
        campid: EPN_CAMPAIGN_ID,
        toolid: "10001"
      });
      return `${baseUrl}?${params.toString()}`;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const rawItemsParam = urlParams.get("items") || "";
    
    // Parse Payload Format (ID:Title,ID:Title)
    const parsedItems = rawItemsParam.split(",").map(entry => {
      const [id, ...titleParts] = entry.split(":");
      const cleanId = (id || "").trim();
      const rawTitle = titleParts.join(":");
      const cleanTitle = rawTitle ? decodeURIComponent(rawTitle) : `eBay Item #${cleanId}`;
      return { id: cleanId, title: cleanTitle, checked: true };
    }).filter(item => item.id.length > 0);

    const itemCountText = document.getElementById("item-count-text");
    const itemListContainer = document.getElementById("item-list");
    const actionBox = document.getElementById("action-box");
    const selectionBar = document.getElementById("selection-bar");
    const selectAllChk = document.getElementById("select-all-chk");
    const selectedCounter = document.getElementById("selected-counter");
    const cartShortcutBtn = document.getElementById("cart-shortcut-btn");
    const openTabsBtn = document.getElementById("open-tabs-btn");
    const cookieFrame = document.getElementById("cookie-frame");

    function updateSelectedCount() {
      const count = parsedItems.filter(i => i.checked).length;
      selectedCounter.textContent = `${count} Selected`;
      cartShortcutBtn.textContent = `Add ${count} ${count === 1 ? 'Item' : 'Items'} to eBay Cart Shortcut`;
      selectAllChk.checked = count === parsedItems.length;
    }

    if (parsedItems.length === 0) {
      itemCountText.textContent = "No valid items found in this share link.";
    } else {
      itemCountText.textContent = `${parsedItems.length} shared item${parsedItems.length > 1 ? 's' : ''} ready to view`;
      actionBox.style.display = "flex";
      selectionBar.style.display = "flex";

      // Cookie trigger for affiliate attribution
      cookieFrame.src = buildEpnUrl(parsedItems[0].id);

      parsedItems.forEach((item, index) => {
        const itemUrl = buildEpnUrl(item.id);
        const card = document.createElement("div");
        card.className = "item-card";

        // Dynamic eBay item thumbnail loader
        const imgUrl = `https://i.ebayimg.com/images/g/${item.id}/s-l1600.jpg`;

        card.innerHTML = `
          <input type="checkbox" class="item-chk" data-index="${index}" ${item.checked ? 'checked' : ''} style="width:16px; height:16px; accent-color:var(--ebay-blue); cursor:pointer;">
          <img src="${imgUrl}" class="item-img-preview" onerror="this.src='https://ir.ebaystatic.com/cr/v/c1/s_1x2.png';">
          <div class="item-details">
            <a href="${itemUrl}" target="_blank" rel="noopener" class="item-title-link">${item.title}</a>
            <div class="item-id-tag">Item ID: ${item.id}</div>
          </div>
        `;

        const chk = card.querySelector(".item-chk");
        chk.addEventListener("change", (e) => {
          parsedItems[index].checked = e.target.checked;
          updateSelectedCount();
        });

        itemListContainer.appendChild(card);
      });

      updateSelectedCount();

      selectAllChk.addEventListener("change", (e) => {
        const isChecked = e.target.checked;
        parsedItems.forEach((item, idx) => {
          item.checked = isChecked;
        });
        document.querySelectorAll(".item-chk").forEach(chk => {
          chk.checked = isChecked;
        });
        updateSelectedCount();
      });

      // Cart Shortcut Trigger
      cartShortcutBtn.addEventListener("click", () => {
        const selectedIds = parsedItems.filter(i => i.checked).map(i => i.id);
        if (selectedIds.length === 0) {
          alert("Please select at least one item.");
          return;
        }

        // Generate eBay multi-item checkout/cart shortcut endpoint
        const multiCartShortcutUrl = `https://www.ebay.com/itm/lk?itemids=${selectedIds.join(",")}&mkevt=1&mkcid=1&mkrid=${EPN_ROTATION_ID}&siteid=0&campid=${EPN_CAMPAIGN_ID}&toolid=10001`;
        
        window.location.href = multiCartShortcutUrl;
      });

      // Staggered multi-tab opening fallback
      openTabsBtn.addEventListener("click", () => {
        const selected = parsedItems.filter(i => i.checked);
        selected.forEach((item, idx) => {
          const url = buildEpnUrl(item.id);
          setTimeout(() => {
            window.open(url, "_blank");
          }, idx * 250);
        });
      });
    }
  </script>
</body>
</html>
