<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CopyCart - Shared Cart Items</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #080A0F;
      --card-bg: rgba(18, 22, 31, 0.85);
      --card-border: rgba(223, 186, 103, 0.25);
      --card-border-glow: rgba(223, 186, 103, 0.9);
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.6);
      --text-gold: #F3D99B;
      --gold-gradient: linear-gradient(135deg, #F9E4B7 0%, #DFBA67 50%, #9E7D3B 100%);
      --gold-solid: #DFBA67;
      --radius-lg: 12px;
      --radius-md: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(223, 186, 103, 0.15) 0%, transparent 65%),
        radial-gradient(circle at 80% 90%, rgba(158, 125, 59, 0.1) 0%, transparent 50%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 12px;
    }

    .app-container {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7), 0 0 25px rgba(223, 186, 103, 0.15);
      width: 100%;
      max-width: 580px;
      height: fit-content;
    }

    .app-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
    }

    .logo-link {
      background: none;
      border: none;
      padding: 0;
      display: inline-block;
      width: 100%;
      max-width: 240px;
    }

    .svg-logo-banner {
      width: 100%;
      height: auto;
      overflow: visible;
      filter: drop-shadow(0 0 15px rgba(223, 186, 103, 0.4));
      display: block;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
      font-weight: 500;
    }

    .instruction-banner {
      font-size: 12px;
      color: var(--text-gold);
      background: rgba(223, 186, 103, 0.08);
      border: 1px solid var(--card-border);
      padding: 10px 14px;
      border-radius: var(--radius-md);
      margin-top: 14px;
      line-height: 1.4;
      text-align: center;
      width: 100%;
    }

    .select-all-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 0 4px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      color: var(--text-gold);
      font-weight: 600;
    }

    .checkbox-label input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: var(--gold-solid);
      cursor: pointer;
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
      max-height: 440px;
      overflow-y: auto;
      padding-right: 6px;
    }

    /* Scrollbar Styling */
    .item-list::-webkit-scrollbar {
      width: 6px;
    }
    .item-list::-webkit-scrollbar-track {
      background: rgba(10, 13, 20, 0.6);
      border-radius: 4px;
    }
    .item-list::-webkit-scrollbar-thumb {
      background: var(--card-border);
      border-radius: 4px;
    }
    .item-list::-webkit-scrollbar-thumb:hover {
      background: var(--card-border-glow);
    }

    .item-card {
      background: rgba(10, 13, 20, 0.6);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s ease;
    }

    .item-card:hover {
      border-color: var(--card-border-glow);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5), 0 0 10px rgba(223, 186, 103, 0.2);
    }

    .item-chk {
      width: 17px;
      height: 17px;
      accent-color: var(--gold-solid);
      cursor: pointer;
      flex-shrink: 0;
    }

    .item-details {
      flex: 1;
      min-width: 0;
    }

    .item-title-link {
      color: var(--text-gold);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      transition: color 0.2s ease;
    }

    .item-title-link:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    .item-id-tag {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .btn-item-cart {
      padding: 8px 14px;
      background: var(--gold-gradient);
      color: #080A0F;
      font-weight: 800;
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      letter-spacing: 0.3px;
      border: 1px solid var(--card-border-glow);
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4), 0 0 10px rgba(223, 186, 103, 0.2);
      transition: all 0.2s ease;
      display: inline-block;
    }

    .btn-item-cart:hover {
      border-color: #ffffff;
      box-shadow: 0 0 15px rgba(223, 186, 103, 0.6);
      transform: translateY(-1px);
    }

    .btn-main {
      width: 100%;
      padding: 14px;
      background: var(--gold-gradient);
      color: #080A0F;
      font-weight: 800;
      font-family: 'Montserrat', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: 1px solid var(--card-border-glow);
      border-radius: 30px;
      cursor: pointer;
      font-size: 13px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4), 0 0 20px rgba(223, 186, 103, 0.25);
      transition: all 0.3s ease;
    }

    .btn-main:hover {
      border-color: #ffffff;
      box-shadow: 0 0 30px rgba(223, 186, 103, 0.7), inset 0 0 12px rgba(255, 255, 255, 0.6);
      transform: translateY(-1px);
    }

    .disclosure {
      font-size: 10px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 16px;
      font-weight: 400;
      line-height: 1.4;
      border-top: 1px solid var(--card-border);
      padding-top: 12px;
    }

    iframe {
      display: none;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="app-header">
      <div class="logo-link">
        <svg class="svg-logo-banner" viewBox="0 0 650 120" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#F9E4B7" />
              <stop offset="50%" stop-color="#DFBA67" />
              <stop offset="100%" stop-color="#9E7D3B" />
            </linearGradient>
            <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="5" result="blur" />
              <feComponentTransfer in="blur" result="glow1">
                <feFuncA type="linear" slope="0.8"/>
              </feComponentTransfer>
              <feMerge>
                <feMergeNode in="glow1" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
            <path id="sparkle" d="M10,0 L12.5,7.5 L20,10 L12.5,12.5 L10,20 L7.5,12.5 L0,10 L7.5,7.5 Z" fill="#F9E4B7" />
          </defs>

          <use href="#sparkle" x="60" y="25">
            <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" />
            <animate attributeName="transform" type="scale" values="0.5;0.9;0.5" dur="2s" repeatCount="indefinite" />
          </use>
          <use href="#sparkle" x="560" y="35">
            <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite" />
            <animate attributeName="transform" type="scale" values="0.8;0.4;0.8" dur="1.5s" repeatCount="indefinite" />
          </use>
          <use href="#sparkle" x="110" y="85">
            <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.5s" repeatCount="indefinite" />
            <animate attributeName="transform" type="scale" values="0.4;0.7;0.4" dur="2.5s" repeatCount="indefinite" />
          </use>

          <text 
            x="50%" 
            y="55%" 
            dominant-baseline="middle" 
            text-anchor="middle"
            style='
              font-family: "Montserrat", "Arial Black", sans-serif;
              font-weight: 900;
              font-size: 76px;
              letter-spacing: -3px;
              fill: url("#goldGradient");
              filter: url("#goldGlow");
            '>
            CopyCart
          </text>
        </svg>
      </div>
      <p class="subtitle" id="item-count-text">Loading shared collection...</p>
      <div class="instruction-banner" id="instruction-banner" style="display:none;">
        Click <strong>Add to Cart</strong> next to any item to add it directly on eBay.
      </div>
    </div>

    <div class="select-all-bar" id="selection-bar" style="display:none;">
      <label class="checkbox-label">
        <input type="checkbox" id="select-all-chk" checked>
        <span>Select All</span>
      </label>
      <span id="selected-counter">0 Selected</span>
    </div>

    <div class="item-list" id="item-list"></div>

    <div id="action-box" style="display:none;">
      <button class="btn-main" id="open-selected-btn">Open Selected Items on eBay</button>
    </div>

    <div class="disclosure">CopyCart generates affiliate links. As an eBay Partner, purchases made through shared links earn commissions.</div>
  </div>

  <iframe id="cookie-frame"></iframe>

  <script>
    const EPN_CAMPAIGN_ID = "5339209459";
    const EPN_ROTATION_ID = "711-53200-19255-0";

    function buildEpnUrl(itemId) {
      const baseUrl = `https://www.ebay.com/itm/${itemId}`;
      const params = new URLSearchParams({
        mkevt: "1",
        mkcid: "1",
        mkrid: EPN_ROTATION_ID,
        siteid: "0",
        campid: EPN_CAMPAIGN_ID,
        toolid: "10001"
      });
      return `${baseUrl}?${params.toString()}`;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const rawItemsParam = urlParams.get("items") || "";
    
    // Parse Payload Format (ID:Title,ID:Title)
    const parsedItems = rawItemsParam.split(",").map(entry => {
      const [id, ...titleParts] = entry.split(":");
      const cleanId = (id || "").trim();
      const rawTitle = titleParts.join(":");
      const cleanTitle = rawTitle ? decodeURIComponent(rawTitle) : `eBay Item #${cleanId}`;
      return { id: cleanId, title: cleanTitle, checked: true };
    }).filter(item => item.id.length > 0);

    const itemCountText = document.getElementById("item-count-text");
    const instructionBanner = document.getElementById("instruction-banner");
    const itemListContainer = document.getElementById("item-list");
    const actionBox = document.getElementById("action-box");
    const selectionBar = document.getElementById("selection-bar");
    const selectAllChk = document.getElementById("select-all-chk");
    const selectedCounter = document.getElementById("selected-counter");
    const openSelectedBtn = document.getElementById("open-selected-btn");
    const cookieFrame = document.getElementById("cookie-frame");

    function updateSelectedCount() {
      const count = parsedItems.filter(i => i.checked).length;
      selectedCounter.textContent = `${count} Selected`;
      openSelectedBtn.textContent = `Open ${count} Selected ${count === 1 ? 'Item' : 'Items'} on eBay`;
      selectAllChk.checked = count === parsedItems.length && parsedItems.length > 0;
    }

    if (parsedItems.length === 0) {
      itemCountText.textContent = "No valid items found in this share link.";
    } else {
      itemCountText.textContent = `${parsedItems.length} shared item${parsedItems.length > 1 ? 's' : ''} ready to view`;
      instructionBanner.style.display = "block";
      actionBox.style.display = "block";
      selectionBar.style.display = "flex";

      // Cookie trigger for affiliate attribution
      cookieFrame.src = buildEpnUrl(parsedItems[0].id);

      parsedItems.forEach((item, index) => {
        const itemUrl = buildEpnUrl(item.id);
        const card = document.createElement("div");
        card.className = "item-card";

        card.innerHTML = `
          <input type="checkbox" class="item-chk" data-index="${index}" ${item.checked ? 'checked' : ''}>
          <div class="item-details">
            <a href="${itemUrl}" target="_blank" rel="noopener" class="item-title-link">${item.title}</a>
            <div class="item-id-tag">Item ID: ${item.id}</div>
          </div>
          <a href="${itemUrl}" target="_blank" rel="noopener" class="btn-item-cart">Add to Cart</a>
        `;

        const chk = card.querySelector(".item-chk");
        chk.addEventListener("change", (e) => {
          parsedItems[index].checked = e.target.checked;
          updateSelectedCount();
        });

        itemListContainer.appendChild(card);
      });

      updateSelectedCount();

      selectAllChk.addEventListener("change", (e) => {
        const isChecked = e.target.checked;
        parsedItems.forEach((item) => {
          item.checked = isChecked;
        });
        document.querySelectorAll(".item-chk").forEach(chk => {
          chk.checked = isChecked;
        });
        updateSelectedCount();
      });

      // Staggered multi-tab opening trigger for batch operations
      openSelectedBtn.addEventListener("click", () => {
        const selected = parsedItems.filter(i => i.checked);
        if (selected.length === 0) {
          alert("Please select at least one item.");
          return;
        }

        selected.forEach((item, idx) => {
          const url = buildEpnUrl(item.id);
          setTimeout(() => {
            window.open(url, "_blank");
          }, idx * 250);
        });
      });
    }
  </script>
</body>
</html>
