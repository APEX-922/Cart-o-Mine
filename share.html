<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Items | CopyCart</title>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #212529;
      --text-muted: #6c757d;
      --border-color: #e9ecef;
      --primary-color: #0066cc;
      --primary-hover: #0052a3;
      --completed-bg: #f1f3f5;
      --completed-border: #ced4da;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.5;
      padding: 20px;
      max-width: 768px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 24px;
      text-align: center;
    }

    h1 {
      font-size: 1.75rem;
      margin-bottom: 8px;
    }

    .subheading {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .instruction-banner {
      background-color: #e7f5ff;
      border: 1px solid #a5d8ff;
      color: #1864ab;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      display: none;
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: background-color 0.2s, border-color 0.2s, opacity 0.2s;
    }

    .item-card.completed {
      background-color: var(--completed-bg);
      border-color: var(--completed-border);
      opacity: 0.75;
    }

    .item-chk {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }

    .item-thumb-wrapper {
      width: 64px;
      height: 64px;
      min-width: 64px;
      border-radius: 6px;
      overflow: hidden;
      background-color: #f1f3f5;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border: 1px solid var(--border-color);
    }

    .item-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .item-thumb-placeholder {
      font-size: 1.5rem;
    }

    .item-details {
      flex: 1;
      min-width: 0;
    }

    .item-title-link {
      font-weight: 600;
      color: var(--text-color);
      text-decoration: none;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      font-size: 0.95rem;
    }

    .item-title-link:hover {
      color: var(--primary-color);
    }

    .item-card.completed .item-title-link {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .item-id-tag {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .btn-item-cart {
      background-color: var(--primary-color);
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      white-space: nowrap;
      transition: background-color 0.2s;
    }

    .btn-item-cart:hover {
      background-color: var(--primary-hover);
    }

    .btn-item-cart.btn-completed {
      background-color: #6c757d;
    }

    .reset-container {
      margin-top: 24px;
      display: none;
      justify-content: flex-end;
    }

    .btn-reset {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: underline;
    }

    .btn-reset:hover {
      color: var(--text-color);
    }
  </style>
</head>
<body>

  <header>
    <h1>Shared List</h1>
    <p class="subheading" id="item-count-text">Loading list...</p>
  </header>

  <div class="instruction-banner" id="instruction-banner">
    Click <strong>Add to Cart</strong> to open each listing on eBay. Checked items will stay marked as complete.
  </div>

  <div class="item-list" id="item-list"></div>

  <div class="reset-container" id="reset-container">
    <button class="btn-reset" id="reset-all-btn">Reset All Completed States</button>
  </div>

  <script>
    const EPN_CAMPAIGN_ID = "5339209459";
    const EPN_ROTATION_ID = "711-53200-19255-0";

    function buildEpnUrl(itemId) {
      const baseUrl = `https://www.ebay.com/itm/${itemId}`;
      const params = new URLSearchParams({
        mkevt: "1",
        mkcid: "1",
        mkrid: EPN_ROTATION_ID,
        siteid: "0",
        campid: EPN_CAMPAIGN_ID,
        toolid: "10001"
      });
      return `${baseUrl}?${params.toString()}`;
    }

    // Scrapes title and primary image via CORS proxy fallback
    async function fetchEbayDetails(itemId) {
      const itemUrl = `https://www.ebay.com/itm/${itemId}`;
      
      // Attempt 1: Fetch live OpenGraph metadata via proxy
      try {
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(itemUrl)}`;
        const res = await fetch(proxyUrl);
        if (res.ok) {
          const data = await res.json();
          const parser = new DOMParser();
          const doc = parser.parseFromString(data.contents, "text/html");

          const ogTitle = doc.querySelector('meta[property="og:title"]')?.getAttribute("content");
          const ogImage = doc.querySelector('meta[property="og:image"]')?.getAttribute("content");

          if (ogTitle || ogImage) {
            return {
              title: ogTitle ? ogTitle.replace(/\s*\|.*$/, '').trim() : null,
              thumbnail: ogImage || null
            };
          }
        }
      } catch (e) {
        console.warn(`Proxy scrape failed for item ${itemId}, attempting fallback...`);
      }

      // Attempt 2: Fallback to direct oEmbed API
      try {
        const response = await fetch(`https://www.ebay.com/services/oembed?url=${encodeURIComponent(itemUrl)}&format=json`);
        if (response.ok) {
          const data = await response.json();
          return {
            title: data.title || null,
            thumbnail: data.thumbnail_url || null
          };
        }
      } catch (e) {
        console.error(`Failed to resolve metadata for item ${itemId}:`, e);
      }

      return null;
    }

    // Parse items parameter: Handles both plain "ID" and "ID:EncodedTitle" formats
    const urlParams = new URLSearchParams(window.location.search);
    const rawItemsParam = urlParams.get("items") || "";

    const parsedItems = rawItemsParam.split(",").map(entry => {
      const [id, ...titleParts] = entry.split(":");
      const cleanId = (id || "").trim();
      const rawTitle = titleParts.join(":");
      const hasTitle = Boolean(rawTitle);
      const cleanTitle = hasTitle ? decodeURIComponent(rawTitle) : `eBay Item #${cleanId}`;
      return { id: cleanId, title: cleanTitle, isPlaceholderTitle: !hasTitle };
    }).filter(item => item.id.length > 0);

    const itemCountText = document.getElementById("item-count-text");
    const instructionBanner = document.getElementById("instruction-banner");
    const itemListContainer = document.getElementById("item-list");
    const resetContainer = document.getElementById("reset-container");
    const resetAllBtn = document.getElementById("reset-all-btn");

    function getCompletedItems() {
      try {
        return JSON.parse(sessionStorage.getItem("copycart_completed_items") || "[]");
      } catch (e) {
        return [];
      }
    }

    function setItemCompleted(itemId) {
      const completed = getCompletedItems();
      if (!completed.includes(itemId)) {
        completed.push(itemId);
        sessionStorage.setItem("copycart_completed_items", JSON.stringify(completed));
      }
    }

    function toggleItemCompleted(itemId, isComplete) {
      let completed = getCompletedItems();
      if (isComplete) {
        if (!completed.includes(itemId)) completed.push(itemId);
      } else {
        completed = completed.filter(id => id !== itemId);
      }
      sessionStorage.setItem("copycart_completed_items", JSON.stringify(completed));
    }

    function renderList() {
      itemListContainer.innerHTML = "";
      const completedIds = getCompletedItems();

      parsedItems.forEach((item) => {
        const itemUrl = buildEpnUrl(item.id);
        const isAlreadyCompleted = completedIds.includes(item.id);

        const card = document.createElement("div");
        card.className = `item-card ${isAlreadyCompleted ? 'completed' : ''}`;

        const chk = document.createElement("input");
        chk.type = "checkbox";
        chk.className = "item-chk";
        chk.checked = isAlreadyCompleted;

        // Image Wrapper
        const thumbWrapper = document.createElement("a");
        thumbWrapper.href = itemUrl;
        thumbWrapper.target = "_blank";
        thumbWrapper.rel = "noopener noreferrer";
        thumbWrapper.className = "item-thumb-wrapper";

        const placeholder = document.createElement("span");
        placeholder.className = "item-thumb-placeholder";
        placeholder.textContent = "🛍️";
        thumbWrapper.appendChild(placeholder);

        // Details Container
        const details = document.createElement("div");
        details.className = "item-details";

        const titleLink = document.createElement("a");
        titleLink.href = itemUrl;
        titleLink.target = "_blank";
        titleLink.rel = "noopener noreferrer";
        titleLink.className = "item-title-link";
        titleLink.id = `item-title-${item.id}`;
        titleLink.textContent = item.title;

        const idTag = document.createElement("div");
        idTag.className = "item-id-tag";
        idTag.textContent = `Item ID: ${item.id}`;

        details.appendChild(titleLink);
        details.appendChild(idTag);

        // CTA Button
        const btn = document.createElement("a");
        btn.href = itemUrl;
        btn.target = "_blank";
        btn.rel = "noopener noreferrer";
        btn.className = `btn-item-cart ${isAlreadyCompleted ? 'btn-completed' : ''}`;
        btn.textContent = isAlreadyCompleted ? 'Complete' : 'Add to Cart';

        function markRowState(completed) {
          if (completed) {
            card.classList.add("completed");
            btn.classList.add("btn-completed");
            btn.textContent = "Complete";
            chk.checked = true;
          } else {
            card.classList.remove("completed");
            btn.classList.remove("btn-completed");
            btn.textContent = "Add to Cart";
            chk.checked = false;
          }
        }

        btn.addEventListener("click", () => {
          setItemCompleted(item.id);
          markRowState(true);
        });

        chk.addEventListener("change", (e) => {
          const checked = e.target.checked;
          toggleItemCompleted(item.id, checked);
          markRowState(checked);
        });

        card.appendChild(chk);
        card.appendChild(thumbWrapper);
        card.appendChild(details);
        card.appendChild(btn);

        itemListContainer.appendChild(card);

        // Asynchronous details fetch for ID-only links generated in support.html
        fetchEbayDetails(item.id).then(detailsRes => {
          if (!detailsRes) return;

          if (item.isPlaceholderTitle && detailsRes.title) {
            item.title = detailsRes.title;
            item.isPlaceholderTitle = false;
            const titleEl = document.getElementById(`item-title-${item.id}`);
            if (titleEl) titleEl.textContent = detailsRes.title;
          }

          if (detailsRes.thumbnail) {
            const img = document.createElement("img");
            img.src = detailsRes.thumbnail;
            img.alt = item.title;
            img.className = "item-thumb";
            img.onload = () => {
              thumbWrapper.innerHTML = "";
              thumbWrapper.appendChild(img);
            };
          }
        });
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (parsedItems.length === 0) {
        itemCountText.textContent = "No valid items found in this share link.";
      } else {
        itemCountText.textContent = `${parsedItems.length} shared item${parsedItems.length > 1 ? 's' : ''} ready to view`;
        instructionBanner.style.display = "block";
        resetContainer.style.display = "flex";

        renderList();

        resetAllBtn.addEventListener("click", () => {
          sessionStorage.removeItem("copycart_completed_items");
          renderList();
        });
      }
    });
  </script>
</body>
</html>
