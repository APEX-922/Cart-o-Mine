<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Cart Items</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      margin: 0;
      background-color: #f4f4f9;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      font-size: 1.25rem;
      margin-top: 0;
    }
    ul.item-list {
      list-style: none;
      padding: 0;
      margin: 16px 0;
    }
    li.item-row {
      padding: 10px;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
    }
    li.item-row:last-child {
      border-bottom: none;
    }
    .tag {
      font-size: 0.75rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      margin-right: 8px;
      text-transform: uppercase;
    }
    .tag.amazon { background: #ff9900; color: #fff; }
    .tag.ebay { background: #0064d2; color: #fff; }
    .item-link {
      color: #333;
      text-decoration: none;
      word-break: break-word;
    }
    .item-link:hover {
      text-decoration: underline;
    }
    .share-btn {
      display: block;
      width: 100%;
      padding: 12px;
      background-color: #0070f3;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .share-btn:active {
      background-color: #0051a8;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Cart Items</h1>
    <ul id="itemList" class="item-list"></ul>
    <button id="nativeShareBtn" class="share-btn">Share Cart</button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const itemListContainer = document.getElementById('itemList');
      const nativeShareBtn = document.getElementById('nativeShareBtn');
      const searchParams = new URLSearchParams(window.location.search);

      const items = [];

      // Extract all Amazon and eBay items passed via URL parameters
      searchParams.forEach((value, key) => {
        if (key.startsWith('amazon_title')) {
          const idx = key.replace('amazon_title', '');
          items.push({
            platform: 'amazon',
            title: value,
            url: searchParams.get(`amazon_url${idx}`) || '#'
          });
        } else if (key.startsWith('ebay_title')) {
          const idx = key.replace('ebay_title', '');
          items.push({
            platform: 'ebay',
            title: value,
            url: searchParams.get(`ebay_url${idx}`) || '#'
          });
        }
      });

      // Render parsed items into HTML list
      if (items.length > 0) {
        items.forEach(item => {
          const li = document.createElement('li');
          li.className = 'item-row';

          const tag = document.createElement('span');
          tag.className = `tag ${item.platform}`;
          tag.innerText = item.platform;

          const link = document.createElement('a');
          link.className = 'item-link';
          link.href = item.url;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.innerText = item.title;

          li.appendChild(tag);
          li.appendChild(link);
          itemListContainer.appendChild(li);
        });
      } else {
        itemListContainer.innerHTML = '<li>No Amazon or eBay items specified.</li>';
      }

      // Synchronous navigator.share call tied directly to the user gesture
      nativeShareBtn.addEventListener('click', () => {
        if (navigator.share) {
          navigator.share({
            title: document.title || 'Cart Items',
            text: 'Check out these items from Amazon and eBay:',
            url: window.location.href
          }).catch((err) => {
            console.warn('Share dismissed or rejected:', err);
          });
        }
      });
    });
  </script>

</body>
</html>
