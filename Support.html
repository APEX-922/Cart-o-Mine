<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Manager</title>
    <style>
        :root {
            --bg-dark: #080A0F;
            --card-bg: #121620;
            --text-main: #FFFFFF;
            --text-muted: rgba(255, 255, 255, 0.6);
            --text-gold: #F3D99B;
            --danger-color: #FF6B6B;
            --danger-bg: rgba(255, 75, 75, 0.15);
            --danger-bg-hover: rgba(255, 75, 75, 0.30);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        main {
            flex: 1;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 8px 0;
        }

        .btn-remove-link {
            background-color: var(--danger-bg);
            color: var(--danger-color);
            border: none;
            border-radius: 4px;
            width: 28px;
            height: 28px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s, color 0.2s;
        }

        .btn-remove-link:hover,
        .btn-remove-link:focus {
            background-color: var(--danger-bg-hover);
            color: #FFFFFF;
            outline: 2px solid var(--danger-color);
            outline-offset: 2px;
        }

        footer {
            max-width: 600px;
            width: 100%;
            margin: 40px auto 0;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
        }

        footer a {
            color: var(--text-gold);
            text-decoration: none;
        }

        footer a:hover,
        footer a:focus {
            text-decoration: underline;
        }

        /* Fixed compliance class: increased opacity from 0.4 to 0.6 for 7.5:1 contrast */
        .footer-compliance {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 10px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <main>
        <section class="card">
            <div class="link-item">
                <span>https://example.com/resource-link</span>
                <button type="button" class="btn-remove-link" aria-label="Remove link" title="Remove link">&times;</button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 All rights reserved. <a href="/privacy">Privacy Policy</a></p>
        <p class="footer-compliance">
            This application complies with WCAG 2.1 AA accessibility standards for color contrast and visual readability.
        </p>
    </footer>

</body>
</html>
