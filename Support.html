<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CopyCart - Multi-Cart Generator</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #2563eb;
      --accent-blue-hover: #1d4ed8;
      --accent-green: #16a34a;
      --accent-red: #dc2626;
      --input-bg: #0f172a;
      --input-border: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-top: 20px;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--text-main);
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 6px;
    }

    main {
      width: 100%;
      max-width: 580px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 12px;
    }

    .form-control {
      flex: 1;
      background-color: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text-main);
      padding: 12px 14px;
      font-size: 0.95rem;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: var(--accent-blue);
    }

    .btn-remove {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.25rem;
      cursor: pointer;
      padding: 4px 8px;
      line-height: 1;
      border-radius: 4px;
    }

    .btn-remove:hover {
      color: var(--accent-red);
    }

    .btn-add {
      background-color: transparent;
      border: 1px dashed var(--input-border);
      color: var(--text-muted);
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 20px;
      transition: all 0.2s;
    }

    .btn-add:hover {
      border-color: var(--text-muted);
      color: var(--text-main);
    }

    .btn-group {
      display: flex;
      gap: 12px;
    }

    .btn {
      flex: 1;
      padding: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: var(--accent-blue);
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: var(--accent-blue-hover);
    }

    .btn-primary.copied-state {
      background-color: var(--accent-green);
    }

    .btn-secondary {
      background-color: #334155;
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background-color: #475569;
    }

    footer {
      margin-top: 40px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 12px 0;
    }

    footer a {
      color: var(--text-muted);
      text-decoration: underline;
    }

    footer a:hover {
      color: var(--text-main);
    }

    #fireworksCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }
  </style>
</head>
<body>

  <canvas id="fireworksCanvas"></canvas>

  <header>
    <h1>CopyCart</h1>
    <p>Generate multi-item referral links & bundle carts instantly</p>
  </header>

  <main>
    <div class="card">
      <div id="urlInputsContainer">
        <div class="input-row">
          <input 
            type="url" 
            class="form-control cartUrl" 
            placeholder="https://www.amazon.com/dp/B08N5WRWNW or https://www.ebay.com/itm/123456789012" 
            aria-label="Product URL" 
            oninput="handleUrlInputChange()" 
            required
          >
        </div>
      </div>

      <button type="button" class="btn-add" onclick="addInputRow()">+ Add Another Product URL</button>

      <div class="btn-group">
        <button id="generateBtn" class="btn btn-primary" onclick="generateAndCopyLink(event)">
          <span id="generateBtnText">GENERATE & COPY LINK</span>
        </button>
        <button id="shareBtn" class="btn btn-secondary" onclick="shareGeneratedLink(event)">
          SHARE LINK
        </button>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; CopyCart. All rights reserved. | <a href="#">Privacy Policy</a></p>
  </footer>

  <script>
    // CopyCart - Global State
    let lastGeneratedUrl = null;
    let copyTimeout = null;
    let isSharingInProgress = false;

    /**
     * Adds an extra URL input field row
     */
    function addInputRow() {
      const container = document.getElementById('urlInputsContainer');
      if (!container) return;

      const row = document.createElement('div');
      row.className = 'input-row';
      row.innerHTML = `
        <input 
          type="url" 
          class="form-control cartUrl" 
          placeholder="https://www.amazon.com/dp/B08N5WRWNW or https://www.ebay.com/itm/123456789012" 
          aria-label="Product URL" 
          oninput="handleUrlInputChange()" 
          required
        >
        <button type="button" class="btn-remove" onclick="removeInputRow(this)">&times;</button>
      `;
      container.appendChild(row);
    }

    /**
     * Removes a specific input field row
     */
    function removeInputRow(button) {
      const row = button.closest('.input-row');
      if (row) {
        row.remove();
        handleUrlInputChange();
      }
    }

    /**
     * Collates input URLs into final string
     */
    function getGeneratedUrl() {
      const inputs = document.querySelectorAll('.cartUrl');
      const urls = Array.from(inputs)
        .map(input => input.value.trim())
        .filter(url => url.length > 0);

      if (urls.length === 0) return null;
      return urls.join(',');
    }

    /**
     * Handles live typing adjustments
     */
    function handleUrlInputChange() {
      const generateBtnText = document.getElementById('generateBtnText');
      if (generateBtnText && generateBtnText.textContent !== 'GENERATE & COPY LINK') {
        restoreGenerateBtnState();
      }
    }

    /**
     * Resets inputs back to single empty field
     */
    function resetInputs() {
      const container = document.getElementById('urlInputsContainer');
      if (!container) return;
      
      container.innerHTML = `
        <div class="input-row">
          <input 
            type="url" 
            class="form-control cartUrl" 
            placeholder="https://www.amazon.com/dp/B08N5WRWNW or https://www.ebay.com/itm/123456789012" 
            aria-label="Product URL" 
            oninput="handleUrlInputChange()" 
            required
          >
        </div>`;
      
      lastGeneratedUrl = null;
      handleUrlInputChange();
    }

    /**
     * Restores Generate Button label
     */
    function restoreGenerateBtnState() {
      const generateBtn = document.getElementById('generateBtn');
      const generateBtnText = document.getElementById('generateBtnText');
      
      if (generateBtn) generateBtn.classList.remove('copied-state');
      if (generateBtnText) generateBtnText.textContent = 'GENERATE & COPY LINK';
    }

    /**
     * Clipboard fallback copy helper
     */
    async function copyToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (err) {
          console.warn('Clipboard API failed, using fallback:', err);
        }
      }

      const textArea = document.createElement('textarea');
      textArea.value = text;
      textArea.style.position = 'fixed';
      textArea.style.left = '-999999px';
      textArea.style.top = '-999999px';
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();

      try {
        const successful = document.execCommand('copy');
        textArea.remove();
        return successful;
      } catch (err) {
        textArea.remove();
        return false;
      }
    }

    /**
     * Generate & Copy Action
     */
    async function generateAndCopyLink(event) {
      if (event) event.preventDefault();
      
      const generatedUrlString = getGeneratedUrl();
      if (!generatedUrlString) return;

      lastGeneratedUrl = generatedUrlString;

      const generateBtn = document.getElementById('generateBtn');
      const generateBtnText = document.getElementById('generateBtnText');

      const success = await copyToClipboard(generatedUrlString);

      if (success) {
        createFireworks(generateBtn);

        if (generateBtn) generateBtn.classList.add('copied-state');
        if (generateBtnText) generateBtnText.textContent = 'LINK COPIED!';

        if (copyTimeout) clearTimeout(copyTimeout);

        copyTimeout = setTimeout(() => {
          resetInputs();
          restoreGenerateBtnState();
        }, 2500);
      } else {
        prompt('Copy your generated link below:', generatedUrlString);
        resetInputs();
        restoreGenerateBtnState();
      }
    }

    /**
     * Native Modal Share Action with Execution Guarding
     */
    async function shareGeneratedLink(event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }

      if (isSharingInProgress) return;

      let targetUrl = lastGeneratedUrl || getGeneratedUrl();
      if (!targetUrl) return;

      const shareBtn = document.getElementById('shareBtn');
      createFireworks(shareBtn);

      isSharingInProgress = true;

      if (navigator.share) {
        try {
          await navigator.share({
            title: 'CopyCart Shared Links',
            url: targetUrl
          });
        } catch (err) {
          // Modal dismissed by user
        } finally {
          // Clears inputs & restores state AFTER modal dismissal
          resetInputs();
          restoreGenerateBtnState();
          
          setTimeout(() => {
            isSharingInProgress = false;
          }, 500);
        }
      } else {
        const copySuccess = await copyToClipboard(targetUrl);
        if (copySuccess) {
          alert('Sharing is not natively supported on this browser. Link has been copied to your clipboard!');
        }
        resetInputs();
        restoreGenerateBtnState();
        isSharingInProgress = false;
      }
    }

    /**
     * Fireworks Particle Generator
     */
    function createFireworks(element) {
      const canvas = document.getElementById('fireworksCanvas');
      if (!canvas || !element) return;
      
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const rect = element.getBoundingClientRect();
      const originX = rect.left + rect.width / 2;
      const originY = rect.top + rect.height / 2;

      const particles = [];
      const particleCount = 30;

      for (let i = 0; i < particleCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 2;
        particles.push({
          x: originX,
          y: originY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          alpha: 1,
          color: `hsl(${Math.random() * 360}, 100%, 50%)`
        });
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let activeParticles = 0;

        particles.forEach(p => {
          if (p.alpha > 0) {
            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= 0.02;
            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
            ctx.fill();
            activeParticles++;
          }
        });

        if (activeParticles > 0) {
          requestAnimationFrame(animate);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }

      animate();
    }
  </script>
</body>
</html>
